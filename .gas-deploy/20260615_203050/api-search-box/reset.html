<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:Arial;
      background:linear-gradient(180deg,#2d00f7,#b100e8);
    }

    .box{
      width:300px;
      padding:30px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      box-shadow:0 0 25px rgba(255,255,255,0.2);
      text-align:center;
      color:white;
    }

    h2{
      margin-bottom:25px;
    }

    .input-box{
      position:relative;
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      outline:none;
      font-size:14px;
      box-sizing:border-box;
    }

    .eye{

  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#555;
  font-size:18px;
}

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:white;
      color:#6A00FF;
      font-weight:bold;
      cursor:pointer;
    }

    #status{
      margin-top:15px;
      font-size:13px;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>RESET PASSWORD</h2>

  <div class="input-box">

  <input
    type="password"
    id="pass1"
    placeholder="Password Baru"
  >

  <span
    class="eye"
    onclick="toggle('pass1')"
  >
    👁
  </span>

</div>

  <div class="input-box">

  <input
    type="password"
    id="pass2"
    placeholder="Konfirmasi Password"
  >

  <span
    class="eye"
    onclick="toggle('pass2')"
  >
    👁
  </span>

</div>

  <button onclick="savePassword()">
    SIMPAN PASSWORD
  </button>

  <div id="status"></div>

</div>

<script>

var email =
  "<?= email ?>";

function toggle(id){

  var input =
    document.getElementById(id);

  if(input.type == "password"){
    input.type = "text";
  }else{
    input.type = "password";
  }
}

function savePassword(){

  var password =
    document.getElementById("pass1").value;

  var confirm =
    document.getElementById("pass2").value;

  var status =
    document.getElementById("status");

  if(password != confirm){

    status.innerHTML =
      "❌ Password tidak sama";

    return;
  }

  status.innerHTML =
    "⏳ Menyimpan password...";

  google.script.run

    .withSuccessHandler(function(res){

      if(res.success){

        status.innerHTML =
          "✅ Password berhasil diubah";

      }else{

        status.innerHTML =
          "❌ " + res.message;
      }

    })

    .withFailureHandler(function(err){

      status.innerHTML =
        "❌ " + err.message;

    })

    .saveNewPassword(
      email,
      password
    );
}

</script>

</body>
</html>
