<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi Face ID - Nadhira Farma</title>
  <meta name="description" content="Absensi Face ID Nadhira Farma dengan deteksi wajah ringan dan validasi GPS cepat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/attendance.css?v=20260605-attendance-bypass-v37">
  <script defer src="assets/auth-guard.js?v=20260601-deploy-fixes"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script defer src="assets/attendance.js?v=20260605-attendance-bypass-v37"></script>
</head>
<body>
  <main class="attendance-shell">
    <section class="attendance-card">
      <header class="attendance-header">
        <a class="brand-link" href="index.html" aria-label="Kembali ke menu utama">
          <img src="https://nadhirafarma.github.io/absensi_apotek/logo.png" alt="">
          <span>
            <strong>Absensi Face ID</strong>
            <small>Apotek Nadhira Farma</small>
          </span>
        </a>
        <div class="clock" id="clockLabel">--:-- WIB</div>
      </header>

      <div class="status-row" aria-label="Status sistem" hidden>
        <span class="status-pill" id="modelStatus">Model disiapkan</span>
        <span class="status-pill" id="gpsStatus">GPS disiapkan</span>
      </div>

      <div class="camera-box">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="faceCanvas"></canvas>
        <div class="scan-guide" aria-hidden="true"></div>
      </div>

      <canvas id="captureCanvas" hidden></canvas>

      <p class="main-status" id="statusText">Menyiapkan kamera dan Face ID...</p>

      <div class="actions">
        <button class="secondary-button" id="retryButton" type="button" hidden>Coba lagi</button>
        <button class="danger-button" id="cancelButton" type="button">Batalkan absensi</button>
      </div>
    </section>
  </main>

  <section class="profile-required-modal" id="profileRequiredModal" hidden>
    <div class="profile-required-card" role="dialog" aria-modal="true" aria-labelledby="profileRequiredTitle">
      <div class="profile-required-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M16 11l2 2 4-4"></path>
        </svg>
      </div>
      <h2 id="profileRequiredTitle">Lengkapi Profil Terlebih Dahulu</h2>
      <p>Absensi Face ID belum bisa dilanjutkan karena data akun profil masih belum lengkap.</p>
      <p class="profile-required-missing" id="profileRequiredMissing"></p>
      <a class="primary-button profile-required-button" href="index.html?view=akun-profil">Lengkapi Profil</a>
    </div>
  </section>

  <section class="visual-reminder-modal attendance-integrity-modal" id="integrityGateModal" hidden>
    <div class="visual-reminder-frame" role="dialog" aria-modal="true" aria-label="Pengingat integritas kerja">
      <img class="visual-reminder-image" src="assets/reminder-integritas.png" alt="Pengingat integritas kerja">
      <button class="reminder-hotspot reminder-hotspot-close" id="integrityCloseButton" type="button" aria-label="Tutup pengingat integritas"></button>
      <button class="reminder-hotspot reminder-hotspot-primary" id="integrityStartButton" type="button" aria-label="Mulai absensi Face ID"></button>
    </div>
  </section>
</body>
</html>
